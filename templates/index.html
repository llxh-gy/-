<!DOCTYPE html>
<html>
<head>
    <title>测试用例生成器</title>
    <meta charset="utf-8">
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        textarea { width: 100%; height: 100px; }
        .result { background: #f0f0f0; padding: 15px; border-radius: 5px; margin-top: 20px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>
    <h1>基于AI的测试用例生成</h1>
    <form action="/generate" method="post">
        <label for="requirement">输入需求描述：</label><br>
        <textarea name="requirement" placeholder="例如：用户登录功能：支持手机号和密码登录，密码错误超过3次需输入验证码。">{{ requirement or '' }}</textarea><br><br>
        <input type="submit" value="生成测试用例">
    </form>
    {% if result %}
    <div class="result">
        <h2>生成的测试用例：</h2>
        {{ result|safe }}
    </div>
    {% endif %}
</body>
</html>
